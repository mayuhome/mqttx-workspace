name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM distribution tag (e.g. latest, next, beta, alpha)'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; the version bundled with Node may be older.
      - name: Update npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dangerously-allow-all-builds

      - name: Determine target version
        id: pkg_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "Syncing library package.json version to tag: $TAG_VERSION"
            npm version $TAG_VERSION --prefix packages/ngx-mqttx --no-git-tag-version --allow-same-version
          fi

          VERSION=$(node -p "require('./packages/ngx-mqttx/package.json').version")
          NAME=$(node -p "require('./packages/ngx-mqttx/package.json').name")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

          # Check if this version is already published on npm
          if npm view "${NAME}@${VERSION}" version --silent 2>/dev/null | grep -q "^${VERSION}$"; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Package ${NAME}@${VERSION} is ALREADY published on npm."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Package ${NAME}@${VERSION} is NOT yet published on npm."
          fi

      - name: Determine npm dist-tag
        if: steps.pkg_info.outputs.already_published == 'false'
        id: dist_tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          VERSION="${{ steps.pkg_info.outputs.version }}"

          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "auto" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$VERSION" =~ alpha ]]; then
            TAG="alpha"
          elif [[ "$VERSION" =~ beta ]]; then
            TAG="beta"
          elif [[ "$VERSION" =~ rc ]]; then
            TAG="rc"
          elif [[ "$VERSION" =~ (next|dev) ]]; then
            TAG="next"
          else
            TAG="latest"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected npm dist-tag: $TAG"

      - name: Run unit tests
        if: steps.pkg_info.outputs.already_published == 'false'
        run: pnpm run test:lib:ci

      - name: Build library
        if: steps.pkg_info.outputs.already_published == 'false'
        run: pnpm run build:lib

      - name: Publish to NPM via Provenance & OIDC
        if: steps.pkg_info.outputs.already_published == 'false'
        run: |
          cd dist/ngx-mqttx
          npm publish --access public --tag ${{ steps.dist_tag.outputs.tag }} --provenance

      - name: Create GitHub Release
        if: steps.pkg_info.outputs.already_published == 'false' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
